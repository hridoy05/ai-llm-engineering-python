[project]
name = "context-memory"
version = "0.1.0"
description = "A conversational AI with context memory management"
readme = "README.md"
authors = [
    { name = "hridoy05", email = "hridoy.banik71@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
context-memory = "__init__:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
